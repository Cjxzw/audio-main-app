# 项目路径含中文，需绕过 Gradle 路径检查
android.overridePathCheck=true

# JVM 编码
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# kotlin.compiler.execution.strategy=in-process：规避 TRAE 沙箱对 kotlin-daemon tmp 文件的限制
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# 强制 AAPT2 使用 Maven 分发版本（绕过 native DLL 依赖，解决 Win 环境缺通用 C 运行时）
android.aapt2.fromMaven=true

# kapt
kapt.use.k2=true
